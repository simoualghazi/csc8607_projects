# Fichier de configuration générique (à adapter au projet)
dataset:
  name: SPEECHCOMMANDS
  root: "./data"
  download: true
  num_workers: 4
  shuffle: true

train:
  seed: 42
  batch_size: 64
  epochs: 15
  optimizer:
    name: adam
    lr: 0.002
    weight_decay: 0.0001
  scheduler:
    name: none

preprocess:
  target_sample_rate: 16000
  target_num_samples: 16000
  n_mels: 64
  n_fft: 400          # à régler parmi {400, 512, 640}
  spec_normalize: standard

augment:
  spec_augment:
    freq_mask_param: 8
    time_mask_param: 20
    num_freq_masks: 1
    num_time_masks: 1

model:
  type: cnn2d
  num_classes: 35
  channels_variant: large   # small ou large

metrics:
  classification:           # ex: ["accuracy", "f1"]
    - accuracy

paths:
  runs_dir: "./runs"
  artifacts_dir: "./artifacts"
