# Fichier de configuration générique (à adapter au projet)
dataset:
  name: SPEECHCOMMANDS
  root: "./data"
  download: true
  num_workers: 4
  shuffle: true

train:
  batch_size: 64

preprocess:
  target_sample_rate: 16000
  target_num_samples: 16000
  n_mels: 64
  n_fft: 400          # à régler parmi {400, 512, 640}
  spec_normalize: standard

augment:
  spec_augment:
    freq_mask_param: 8
    time_mask_param: 20
    num_freq_masks: 1
    num_time_masks: 1

model:
  type: TODO                # ex: "resnet18", "mlp", "lstm", ...
  num_classes: TODO
  input_shape:              # ex: [3, 32, 32] ou null
  hidden_sizes:             # ex: [256, 128] ou null
  activation: relu          # ex: relu, gelu, tanh...
  dropout: 0.0              # ex: 0.0–0.5
  batch_norm: false         # true/false
  residual: false           # true/false
  attention: false          # true/false
  rnn:                      # pour RNN/LSTM/GRU : paramètres ou null
    type: null              # lstm/gru
    hidden_size: null
    num_layers: null
    bidirectional: false

train:
  seed: 42
  device: auto              # "cpu", "cuda", ou "auto"
  batch_size: 64
  epochs: 10
  max_steps: null           # entier ou null
  overfit_small: false      # true pour sur-apprendre sur un petit échantillon

  optimizer:
    name: adam              # sgd/adam/rmsprop
    lr: 0.001
    weight_decay: 0.0
    momentum: 0.9           # utile si SGD

  scheduler:
    name: none              # none/step/cosine/onecycle
    step_size: 10
    gamma: 0.1
    warmup_steps: 0

metrics:
  classification:           # ex: ["accuracy", "f1"]
    - accuracy
  regression: []            # ex: ["mae", "rmse"]

hparams:                    # espace pour mini grid search
  lr: [0.0005, 0.001, 0.005]
  batch_size: [32, 64]
  weight_decay: [0.0, 0.0005]

paths:
  runs_dir: "./runs"
  artifacts_dir: "./artifacts"
